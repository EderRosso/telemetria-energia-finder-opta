# =====================================================================
#  Mosquitto — broker MQTT próprio para a Telemetria de Energia
#  Teste na rede local: porta 1883 com usuário e senha (sem TLS).
#  Produção na internet: use a porta 8883 com TLS (veja LEIA-ME.md).
# =====================================================================
listener 1883
allow_anonymous false

# Ajuste os caminhos para a pasta onde estão estes arquivos
# Windows (exemplo): C:\mosquitto\config\passwd
password_file passwd
acl_file acl

persistence true
log_type error
log_type warning
log_type notice
